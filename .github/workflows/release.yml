# Push a tag such as v0.1.0 to build a tarball and attach it to a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tarball:
    # Built on Ubuntu 24.04 so the binary runs on any distro at least that new
    # (glibc 2.39, GTK 4.14): Ubuntu 24.04+, Debian 13+, Fedora 40+, Arch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and gtk4-layer-shell
        run: ./ci/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      # The binary looks for libraries in ../lib/pixelscale first, so the release can carry
      # its own gtk4-layer-shell for distros that do not package it.
      - run: cargo build --release
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/../lib/pixelscale
      - name: Package
        run: |
          name="pixelscale-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$name/lib"
          cp target/release/pixelscale install.sh README.md LICENSE "$name/"
          cp -r data assets "$name/"
          so=$(ldd target/release/pixelscale | awk '/gtk4-layer-shell/ { print $3 }')
          cp -L "$so" "$name/lib/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pixelscale-*.tar.gz pixelscale-*.sha256 --generate-notes
